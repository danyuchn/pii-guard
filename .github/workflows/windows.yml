name: Windows

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Keep private test jobs inside the Windows user profile
        shell: pwsh
        run: |
          $privateTemp = Join-Path $env:USERPROFILE "pii-guard-ci-temp"
          New-Item -ItemType Directory -Force -Path $privateTemp | Out-Null
          "TMP=$privateTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$privateTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra formats

      - name: Import the local web module
        run: uv run python -c "import pii_guard.web"

      # TEMPORARY diagnostic: the format worker only reports fixed safe error
      # codes, so CI cannot see why xlsx/docx parsing fails on Windows.
      # Remove once the cause is fixed.
      - name: TEMP diagnose xlsx/docx format worker
        continue-on-error: true
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib, io, tempfile, traceback
          from pathlib import Path
          import openpyxl
          from docx import Document
          from pii_guard import file_handlers as fh

          tmp = Path(tempfile.mkdtemp())

          wb = openpyxl.Workbook(); ws = wb.active; ws.title = "Sheet1"
          ws["A1"] = "\u59d3\u540d"; ws["B1"] = "A123456789"
          xlsx = tmp / "d.xlsx"; wb.save(str(xlsx)); wb.close()

          doc = Document(); doc.add_paragraph("\u5f35\u4e09 A123456789")
          docx = tmp / "d.docx"; doc.save(str(docx))

          for path, parser in ((xlsx, fh._parse_excel_bytes), (docx, fh._parse_docx_bytes)):
              print("=" * 60, flush=True)
              print("FILE:", path.name, flush=True)
              direct = path.read_bytes()
              print("  read_bytes  len=%d sha=%s" % (len(direct), hashlib.sha256(direct).hexdigest()[:16]), flush=True)
              try:
                  viafh = fh._read_source_bytes(path)
                  print("  _read_source_bytes len=%d sha=%s IDENTICAL=%s"
                        % (len(viafh), hashlib.sha256(viafh).hexdigest()[:16], viafh == direct), flush=True)
              except Exception:
                  viafh = direct
                  traceback.print_exc()
              print("  --- raw library parse (no masking) ---", flush=True)
              try:
                  if path.suffix == ".xlsx":
                      w = openpyxl.load_workbook(io.BytesIO(direct), read_only=True, data_only=True)
                      print("  load_workbook OK sheets=%s" % (w.sheetnames,), flush=True)
                      for row in w[w.sheetnames[0]].iter_rows():
                          for c in row:
                              if c.value is not None:
                                  print("    cell", c.coordinate, repr(c.value), flush=True)
                      w.close()
                  else:
                      d = Document(io.BytesIO(direct))
                      print("  Document OK paragraphs=%d" % len(d.paragraphs), flush=True)
              except Exception:
                  traceback.print_exc()
              print("  --- module parser (masked) ---", flush=True)
              try:
                  print("  parser OK:", str(parser(direct))[:120], flush=True)
              except Exception:
                  traceback.print_exc()
              print("  --- through the spawn worker ---", flush=True)
              try:
                  print("  worker OK:", str(fh._run_file_worker("read", path.suffix, direct))[:120], flush=True)
              except Exception:
                  traceback.print_exc()
          PY

      - name: Run quick, restore, web, deletion, locking, and junction tests
        run: uv run pytest -m "not slow" -q

      - name: Type-check Windows and POSIX branches
        run: |
          uv run mypy src/
          uv run mypy --platform linux src/

      - name: Lint source and tests
        run: uv run ruff check src/ tests/
