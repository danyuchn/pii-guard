name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONWARNINGS: ignore

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra formats

      - name: Check formatting
        run: >-
          uv run ruff format --check
          src/pii_guard/file_handlers.py
          src/pii_guard/cli.py
          src/pii_guard/server.py
          tests/test_file_handlers.py
          tests/test_mcp_server.py
          tests/eval/conftest.py

      - name: Lint source and tests
        run: uv run ruff check src/ tests/

      - name: Type-check source
        run: uv run mypy src/

      - name: Run non-model tests
        run: uv run pytest -m "not slow" -q --disable-warnings

      - name: Run public synthetic evaluation
        run: uv run pytest tests/eval -m "eval and not slow" -q --disable-warnings
